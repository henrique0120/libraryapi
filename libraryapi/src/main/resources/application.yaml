springdoc:
  override-with-generic-response: false

logging:
  file:
    name: app.log
  level:
    root: warn
    io:
      github:
        henrique0120: info
    org:
      springframework:
        web: debug
        security: trace

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: '*'
